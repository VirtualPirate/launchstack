services:
  postgres:
    image: postgres:18
    container_name: launchstack-postgres
    restart: unless-stopped
    ports:
      - "11753:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-launchstack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-launchstack}
      POSTGRES_DB: ${POSTGRES_DB:-launchstack}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-launchstack} -d ${POSTGRES_DB:-launchstack}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    container_name: launchstack-otel-collector
    restart: unless-stopped
    user: "0:0"
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infra/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
      - ./logs:/var/log/app:ro
      - otel_checkpoints:/var/lib/otelcol/checkpoints
    environment:
      DEPLOY_ENV: ${DEPLOY_ENV:-local}
      GRAFANA_CLOUD_OTLP_ENDPOINT: ${GRAFANA_CLOUD_OTLP_ENDPOINT}
      GRAFANA_CLOUD_OTLP_AUTH: ${GRAFANA_CLOUD_OTLP_AUTH}

volumes:
  postgres_data:
  otel_checkpoints:
