services:
  postgres:
    image: postgres:18
    container_name: launchstack-postgres
    restart: unless-stopped
    ports:
      - "11753:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-launchstack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-launchstack}
      POSTGRES_DB: ${POSTGRES_DB:-launchstack}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-launchstack} -d ${POSTGRES_DB:-launchstack}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    container_name: launchstack-otel-collector
    restart: unless-stopped
    user: "0:0"
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infra/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
      - ./logs:/var/log/app:ro
      - otel_checkpoints:/var/lib/otelcol/checkpoints
    environment:
      DEPLOY_ENV: ${DEPLOY_ENV:-local}
      GRAFANA_CLOUD_OTLP_ENDPOINT: ${GRAFANA_CLOUD_OTLP_ENDPOINT}
      GRAFANA_CLOUD_OTLP_AUTH: ${GRAFANA_CLOUD_OTLP_AUTH}

  temporal:
    image: temporalio/auto-setup:1.29.7
    container_name: launchstack-temporal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-launchstack}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-launchstack}
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      ENABLE_ES: "false"
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.52.1
    container_name: launchstack-temporal-ui
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "${TEMPORAL_UI_PORT:-8080}:8080"

  # CLI container (`temporal`, `tctl`). Used by `pnpm temporal:reset` to poll
  # cluster health; also handy for `docker exec -it launchstack-temporal-admin temporal workflow list`.
  temporal-admin-tools:
    image: temporalio/admin-tools:1.29.7-tctl-1.18.4-cli-1.7.2
    container_name: launchstack-temporal-admin
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    stdin_open: true
    tty: true
    command: ["sleep", "infinity"]

volumes:
  postgres_data:
  otel_checkpoints:
